<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" type="image/png" href="./img/oilmap.png" sizes="16x16">
    <meta name="author" content="Roque Leal" />
    <meta name="copyright" content="https://oilmap.xyz" />
    <meta name="description" content="Oil and gas news and market analysis from World Oil Map: OPEC production, upstream exploration, downstream refining and crude oil prices.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://oilmap.xyz/blog.html">
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://oilmap.xyz/img/preview.jpg" />
    <meta property="og:title" content="Global Petroleum News | World Oil Map" />
    <meta property="og:description" content="Oil and gas news and market analysis from World Oil Map." />
    <meta property="og:url" content="https://oilmap.xyz/blog.html" />
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@roqueleal08">
    <title>Global Petroleum News and Oil Market Analysis | World Oil Map</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Global Petroleum News",
        "description": "Oil and gas news and market analysis published by World Oil Map.",
        "url": "https://oilmap.xyz/blog.html",
        "inLanguage": "en",
        "isPartOf": { "@type": "WebSite", "name": "World Oil Map", "url": "https://oilmap.xyz/" },
        "about": ["Oil market", "OPEC", "Upstream exploration", "Downstream refining", "Crude oil prices"]
    }
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4035003913367801" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
         :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #020617;
            --border-color: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
            --primary-gold: #f0b823;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(2, 6, 23, 0.9);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand h1 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary-gold);
            letter-spacing: 1px;
        }
        
        .brand h1 a {
            color: var(--primary-gold);
            text-decoration: none;
        }
        
        .brand img {
            height: 28px;
            width: auto;
        }
        
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.2s;
            margin-left: 15px;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }
        
        .blog-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px 20px 20px;
        }
        
        select {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            min-width: 260px;
        }
        
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        
        h1.main-title {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            margin-top: 0;
            font-size: 1rem;
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        
        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .news-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        
        .card-meta {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }
        
        .badge-source {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
        
        .badge-date {
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            display: block;
            background: #020617;
        }
        
        .gdelt-text-wrapper {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .gdelt-text-wrapper a {
            color: var(--text-main) !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            display: block;
            margin-bottom: 8px;
            transition: color 0.2s;
            line-height: 1.4;
        }
        
        .gdelt-text-wrapper a:hover {
            color: var(--accent) !important;
        }
        
        .news-snippet {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
            flex: 1;
        }
        
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        .filter-bar label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #ownNews:not(:empty) {
            margin-bottom: 24px;
        }

        .own-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 8px;
        }

        .own-title a {
            color: var(--text-main);
            text-decoration: none;
        }

        .own-title a:hover {
            color: var(--accent);
        }

        .news-card[hidden] {
            display: none;
        }

        .news-empty {
            color: var(--text-muted);
        }

        footer {
            max-width: 1100px;
            margin: 40px auto 0;
            padding: 24px 20px 40px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent-hover);
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <img src="./img/oilmap.png" alt="Icon" onerror="this.style.display='none'">
            <h1>
                <a href="/">WORLD OIL MAP 2026</a>
            </h1>
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/blog.html" class="active">Blog</a>
            <a href="/cited-by.html">Cited by</a>
            <a href="/contact.html">Contact</a>
        </nav>
    </header>

    <div class="blog-container">

        <h1 class="main-title" id="pageTitle">Global Petroleum News</h1>
        <p class="subtitle" id="subtitle">News and analysis published by World Oil Map.</p>

        <div class="filter-bar">
            <label for="topicFilter">Topic</label>
            <select id="topicFilter">
                <option value="all">All topics</option>
                <option value="market">Global Petroleum &amp; Oil Market</option>
                <option value="opec">OPEC &amp; Production</option>
                <option value="upstream">Upstream &amp; Exploration</option>
                <option value="downstream">Downstream &amp; Refineries</option>
                <option value="prices">Crude Oil Prices</option>
            </select>
        </div>

        <section id="ownNews" class="news-grid">
            <!-- news:start -->
            <p class="news-empty">No articles have been published yet.</p>
            <!-- news:end -->
        </section>

    </div>

    <footer>
        © 2026 World Oil Map · Open Data · Open Source · <a href="/">Open the interactive map</a>
    </footer>

    <script>
        document.getElementById('topicFilter').addEventListener('change', event => {
            const topic = event.target.value;
            document.querySelectorAll('#ownNews .news-card').forEach(card => {
                card.hidden = topic !== 'all' && card.dataset.topic !== topic;
            });
        });
    </script>
</body>

</html>
