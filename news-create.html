<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="./img/oilmap.png" sizes="16x16">
    <title>Crear noticia · World Oil Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #020617;
            --border-color: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
            --primary-gold: #f0b823;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: rgba(2, 6, 23, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 {
            font-size: 1rem;
            margin: 0;
            letter-spacing: 1px;
        }

        .brand h1 a {
            color: var(--primary-gold);
            text-decoration: none;
        }

        .brand img {
            height: 28px;
            width: auto;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            margin-left: 15px;
        }

        .nav-links a:hover {
            color: white;
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .wrap {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .panel + .panel {
            margin-top: 24px;
        }

        h2.panel-title {
            font-size: 0.9rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 14px 0 6px;
        }

        label small {
            font-size: 0.75rem;
        }

        input,
        textarea {
            width: 100%;
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            font-size: 0.95rem;
        }

        textarea {
            min-height: 240px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: #022c22;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #7f1d1d;
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        button.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 14px 0 0;
        }

        code {
            color: var(--primary-gold);
        }

        .serp {
            background: #fff;
            color: #202124;
            border-radius: 12px;
            padding: 16px 18px;
            font-family: arial, sans-serif;
        }

        .serp-url {
            font-size: 0.85rem;
            color: #4d5156;
            word-break: break-all;
        }

        .serp-title {
            font-size: 1.25rem;
            color: #1a0dab;
            margin: 4px 0;
            line-height: 1.3;
        }

        .serp-desc {
            font-size: 0.9rem;
            color: #4d5156;
            line-height: 1.5;
            margin: 0;
        }

        .checks {
            list-style: none;
            padding: 0;
            margin: 14px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checks li {
            padding: 4px 0;
        }

        .checks .ok {
            color: var(--accent);
        }

        .checks .no {
            color: #f87171;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .list-item small {
            color: var(--text-muted);
        }

        .empty {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }

        textarea.snippet {
            min-height: 120px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <img src="./img/oilmap.png" alt="Icon" onerror="this.style.display='none'">
            <h1><a href="index.html">WORLD OIL MAP 2026</a></h1>
        </div>
        <nav class="nav-links">
            <a href="blog.html">Blog</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="wrap">
        <section>
            <div class="panel">
                <h2 class="panel-title">Nueva noticia</h2>
                <form id="form">
                    <label for="title">Título (H1) <small>Con la palabra clave al inicio</small></label>
                    <input id="title" required>

                    <label for="seoTitle">Título SEO <small><span id="cSeo">0</span>/60</small></label>
                    <input id="seoTitle" maxlength="60" placeholder="Si lo dejas vacío se usa el título">

                    <label for="slug">URL (slug) <small>news/<span id="slugPreview"></span>.html</small></label>
                    <input id="slug" placeholder="se genera desde el título">

                    <label for="summary">Meta descripción <small><span id="cDesc">0</span>/160</small></label>
                    <input id="summary" maxlength="160" required>

                    <label for="keywords">Palabras clave (separadas por comas) <small>La primera es la principal</small></label>
                    <input id="keywords" placeholder="precio petroleo brent, opep, produccion">

                    <label for="date">Fecha de publicación</label>
                    <input id="date" type="date" required>

                    <label for="image">URL de imagen (opcional)</label>
                    <input id="image" type="url" placeholder="https://...">

                    <label for="body">Contenido <small><span id="cWords">0</span> palabras (recomendado 300+)</small></label>
                    <textarea id="body" required></textarea>

                    <div class="actions">
                        <button type="submit">Añadir noticia</button>
                        <button type="button" class="secondary" id="clear">Limpiar formulario</button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="panel">
                <h2 class="panel-title">Vista previa en Google</h2>
                <div class="serp">
                    <div class="serp-url" id="serpUrl"></div>
                    <div class="serp-title" id="serpTitle"></div>
                    <p class="serp-desc" id="serpDesc"></p>
                </div>
                <h2 class="panel-title" style="margin-top:20px">Checklist SEO</h2>
                <ul class="checks" id="checks"></ul>
            </div>

            <div class="panel">
                <h2 class="panel-title">Noticias publicadas (<span id="count">0</span>)</h2>
                <div id="list"></div>
                <div class="actions">
                    <button type="button" id="download">Descargar archivos para publicar</button>
                </div>
                <p class="hint">
                    Se descargan <code>data/news.json</code> y una página <code>news/&lt;slug&gt;.html</code> por cada noticia.
                    Sube ambos a su carpeta en el repositorio. Añade también las URLs al sitemap (abajo).
                </p>
                <textarea class="snippet" id="sitemap" readonly></textarea>
            </div>
        </section>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const BASE = 'https://www.oilmap.xyz';
        const FIELDS = ['title', 'seoTitle', 'slug', 'date', 'image', 'summary', 'keywords', 'body'];
        let articles = [];
        let slugTouched = false;

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function formatDate(iso) {
            const d = new Date(iso + 'T00:00:00');
            return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function slugify(text) {
            return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
                .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'noticia';
        }

        function paragraphs(body) {
            return body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        }

        function readForm() {
            const data = {};
            FIELDS.forEach(f => data[f] = $(f).value.trim());
            return data;
        }

        function buildArticlePage(a) {
            const url = `${BASE}/news/${a.slug}.html`;
            const title = a.seoTitle || `${a.title} · World Oil Map`;
            const image = a.image || `${BASE}/img/preview.jpg`;
            const keywords = a.keywords.split(',').map(k => k.trim()).filter(Boolean).join(', ');
            const ld = {
                '@context': 'https://schema.org',
                '@type': 'NewsArticle',
                headline: a.title,
                description: a.summary,
                datePublished: a.date,
                dateModified: a.date,
                mainEntityOfPage: url,
                image: [image],
                keywords,
                author: { '@type': 'Organization', name: 'World Oil Map', url: BASE },
                publisher: { '@type': 'Organization', name: 'World Oil Map', logo: { '@type': 'ImageObject', url: `${BASE}/img/oilmap.png` } }
            };
            const body = paragraphs(a.body).map(p => `<p>${esc(p)}</p>`).join('\n        ');
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${esc(title)}</title>
    <meta name="description" content="${esc(a.summary)}">
    <meta name="keywords" content="${esc(keywords)}">
    <link rel="canonical" href="${url}">
    <link rel="icon" type="image/png" href="../img/oilmap.png" sizes="16x16">
    <meta property="og:type" content="article">
    <meta property="og:title" content="${esc(title)}">
    <meta property="og:description" content="${esc(a.summary)}">
    <meta property="og:url" content="${url}">
    <meta property="og:image" content="${esc(image)}">
    <meta property="article:published_time" content="${a.date}">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">${JSON.stringify(ld).replace(/</g, '\\u003c')}<\/script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; line-height: 1.7; }
        header { background: #020617; border-bottom: 1px solid #334155; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #f0b823; text-decoration: none; font-weight: 600; letter-spacing: 1px; font-size: 1rem; }
        nav a { color: #aaa; text-decoration: none; font-size: 14px; margin-left: 15px; }
        article { max-width: 760px; margin: 0 auto; padding: 30px 20px 60px; }
        .meta { color: #10b981; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        h1 { font-size: 2rem; line-height: 1.25; margin: 8px 0 16px; }
        .lead { color: #94a3b8; font-size: 1.1rem; }
        article img { width: 100%; border-radius: 12px; border: 1px solid #334155; margin: 20px 0; }
        article p { color: #cbd5e1; }
        .back { display: inline-block; margin-top: 30px; color: #10b981; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html">WORLD OIL MAP 2026</a>
        <nav><a href="../blog.html">Blog</a><a href="../index.html">Home</a></nav>
    </header>
    <article>
        <div class="meta"><time datetime="${a.date}">${esc(formatDate(a.date))}</time> · World Oil Map</div>
        <h1>${esc(a.title)}</h1>
        <p class="lead">${esc(a.summary)}</p>
        ${a.image ? `<img src="${esc(a.image)}" alt="${esc(a.title)}">` : ''}
        ${body}
        <a class="back" href="../blog.html">Back to the blog</a>
    </article>
</body>
</html>
`;
        }

        function renderPreview() {
            const d = readForm();
            const slug = d.slug || slugify(d.title);
            $('serpUrl').textContent = `${BASE}/news/${slug}.html`;
            $('serpTitle').textContent = d.seoTitle || (d.title ? `${d.title} · World Oil Map` : 'Título de la noticia');
            $('serpDesc').textContent = d.summary || 'La meta descripción aparecerá aquí.';
            $('slugPreview').textContent = slug;
            $('cSeo').textContent = d.seoTitle.length;
            $('cDesc').textContent = d.summary.length;
            $('cWords').textContent = d.body ? d.body.split(/\s+/).filter(Boolean).length : 0;
            renderChecks(d, slug);
        }

        function renderChecks(d, slug) {
            const primary = d.keywords.split(',')[0].trim().toLowerCase();
            const first = paragraphs(d.body)[0] || '';
            const checks = [
                ['Título SEO entre 30 y 60 caracteres', d.seoTitle.length >= 30 && d.seoTitle.length <= 60],
                ['Meta descripción entre 120 y 160 caracteres', d.summary.length >= 120 && d.summary.length <= 160],
                ['Hay una palabra clave principal', primary.length > 0],
                ['Palabra clave en el título', !!primary && (d.title + ' ' + d.seoTitle).toLowerCase().includes(primary)],
                ['Palabra clave en la descripción', !!primary && d.summary.toLowerCase().includes(primary)],
                ['Palabra clave en la URL', !!primary && slug.includes(slugify(primary))],
                ['Palabra clave en el primer párrafo', !!primary && first.toLowerCase().includes(primary)],
                ['Contenido de 300 palabras o más', d.body.split(/\s+/).filter(Boolean).length >= 300]
            ];
            $('checks').innerHTML = checks.map(([label, ok]) =>
                `<li><span class="${ok ? 'ok' : 'no'}">${ok ? 'OK' : 'Pendiente'}</span> · ${label}</li>`).join('');
        }

        function renderList() {
            $('count').textContent = articles.length;
            const list = $('list');
            list.innerHTML = '';
            if (articles.length === 0) {
                list.innerHTML = '<p class="empty">Todavía no hay noticias.</p>';
            }
            articles.forEach(a => {
                const row = document.createElement('div');
                row.className = 'list-item';
                const info = document.createElement('span');
                info.textContent = a.title + ' ';
                const small = document.createElement('small');
                small.textContent = `${formatDate(a.date)} · /news/${a.slug}.html`;
                info.append(small);
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'danger';
                del.textContent = 'Eliminar';
                del.addEventListener('click', () => {
                    if (!confirm('¿Eliminar esta noticia?')) return;
                    articles = articles.filter(x => x.id !== a.id);
                    renderList();
                });
                row.append(info, del);
                list.append(row);
            });
            $('sitemap').value = articles.map(a =>
                `<url>\n\t<loc>${BASE}/news/${a.slug}.html</loc>\n\t<lastmod>${a.date}</lastmod>\n\t<priority>0.7</priority>\n</url>`
            ).join('\n');
        }

        function sortArticles() {
            articles.sort((a, b) => b.date.localeCompare(a.date));
        }

        function download(filename, content, type) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([content], { type }));
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        $('title').addEventListener('input', () => {
            if (!slugTouched) $('slug').value = slugify($('title').value);
            renderPreview();
        });

        $('slug').addEventListener('input', () => {
            slugTouched = true;
            $('slug').value = slugify($('slug').value);
            renderPreview();
        });

        $('form').addEventListener('submit', e => {
            e.preventDefault();
            const d = readForm();
            const id = Date.now().toString(36);
            const slug = d.slug || slugify(d.title);
            const unique = articles.some(a => a.slug === slug) ? `${slug}-${id}` : slug;
            articles.push({ id, ...d, slug: unique });
            sortArticles();
            renderList();
            e.target.reset();
            slugTouched = false;
            renderPreview();
        });

        $('clear').addEventListener('click', () => {
            $('form').reset();
            slugTouched = false;
            renderPreview();
        });

        FIELDS.forEach(f => $(f).addEventListener('input', renderPreview));

        $('download').addEventListener('click', () => {
            download('news.json', JSON.stringify(articles, null, 2) + '\n', 'application/json');
            articles.forEach((a, i) => {
                setTimeout(() => download(`${a.slug}.html`, buildArticlePage(a), 'text/html'), 300 * (i + 1));
            });
        });

        fetch('data/news.json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : [])
            .then(data => { articles = data; sortArticles(); })
            .catch(() => { articles = []; })
            .finally(() => {
                renderList();
                renderPreview();
            });
    </script>
</body>

</html>
