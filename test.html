<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <!-- PALABRAS CLAVE Y SEO ORIGINALES INTACTAS -->
    <link rel="icon" type="image/png" href="./img/oilmap.png" sizes="16x16">
    <meta name="author" content="Roque Leal" />
    <meta name="copyright" content="https://oilmap.xyz" />
    <meta name="description" content="🛢️ Discover World Oil Map 2026, information & knowledge about Upstream and Downstream activities for Oil and Gas.">
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://oilmap.xyz/img/preview.jpg" />
    <meta property="og:title" content="World Oil Map 2026" />
    <meta property="og:url" content="https://oilmap.xyz" />
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@roqueleal08">
    <title>🥇 World Oil Map 2026</title>

    <!-- RECURSOS EXTERNOS -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4035003913367801" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-language/v0.10.1/mapbox-gl-language.js'></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.1/mapbox-gl-geocoder.min.js'></script>
    <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.1/mapbox-gl-geocoder.css' type='text/css' />
    
    <!-- Asegúrate de tener este archivo si usas customData -->
    <script src="data/geocoder.js"></script>

    <!-- ESTILOS MINIMALISTAS Y MODERNOS -->
    <style>
        :root {
            --primary-gold: #f0b823;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --transition: all 0.3s ease;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text-main);
            overflow: hidden;
        }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        .glass-ui {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        
        .ui-layer {
            position: absolute; z-index: 10; inset: 0;
            pointer-events: none; display: flex; flex-direction: column; padding: 15px;
        }
        
        .ui-layer > * { pointer-events: auto; }
        
        .header {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
        }
        
        .brand {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-radius: 100px;
        }
        .brand img { height: 28px; }
        .brand h1 { font-size: 1rem; margin: 0; color: var(--primary-gold); letter-spacing: 1px; }
        .brand span { font-weight: 300; opacity: 0.6; }
        
        /* BUSCADOR Y ZONAS EN VIVO */
        .search-container {
            position: relative; flex-grow: 1; max-width: 450px;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .search-bar-row { display: flex; gap: 8px; width: 100%; }
        
        .search-input {
            flex-grow: 1; padding: 10px 16px; border-radius: 100px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: var(--text-main); font-family: inherit; font-size: 0.85rem;
            outline: none; transition: var(--transition);
        }
        .search-input:focus { border-color: var(--primary-gold); }
        
        .btn-live-zones {
            display: flex; align-items: center; padding: 0 16px;
            border-radius: 100px; background: rgba(240, 184, 35, 0.1);
            border: 1px solid var(--primary-gold); color: var(--primary-gold);
            font-weight: 600; font-size: 0.85rem; cursor: pointer;
            transition: var(--transition); white-space: nowrap;
        }
        .btn-live-zones:hover { background: var(--primary-gold); color: #000; }
        
        #suggestions {
            position: absolute; top: 45px; left: 0; right: 0;
            border-radius: 12px; display: none; max-height: 200px; overflow-y: auto; z-index: 30;
        }
        .suggestion-item {
            padding: 10px 16px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .suggestion-item:hover { color: var(--primary-gold); background: rgba(255,255,255,0.05); }

        #liveZonesMenu {
            position: absolute; top: 45px; left: 0; right: 0;
            border-radius: 12px; display: none; flex-direction: column; max-height: 250px; overflow-y: auto; z-index: 30;
        }
        .zone-item {
            padding: 10px 16px; cursor: pointer; font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 4px;
        }
        .zone-item:hover { background: rgba(255,255,255,0.05); color: var(--primary-gold); }
        .zone-item strong { font-size: 0.7rem; color: #a0a0a5; }

        /* CONTROLES DERECHOS (About, Blog, Contact, Layers) */
        .header-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        
        .btn-header {
            padding: 8px 14px; border-radius: 100px; border: 1px solid var(--glass-border);
            color: var(--text-main); font-size: 0.75rem; font-weight: 600;
            text-decoration: none; cursor: pointer; background: rgba(255,255,255,0.05);
            transition: var(--transition);
        }
        .btn-header:hover { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); }
        
        #menu {
            position: absolute; top: 60px; right: 15px; width: 180px;
            padding: 10px; display: none; flex-direction: column; gap: 4px; border-radius: 12px;
        }
        #menu.show { display: flex; }
        #menu a {
            color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 0.75rem;
            padding: 8px 12px; border-radius: 6px; text-transform: uppercase; transition: var(--transition);
        }
        #menu a:hover { background: rgba(255,255,255,0.1); }
        #menu a.active { background: var(--primary-gold); color: #000; font-weight: 600; }

        /* PUBLICIDAD */
        .ad-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 5; width: 95%; max-width: 728px; display: flex; justify-content: center;
        }

        /* MODAL */
        .modal {
            position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content { padding: 30px; width: 85%; max-width: 400px; text-align: center; border-radius: 16px; position: relative; }
        .close { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; transition: var(--transition); }
        .close:hover { color: var(--primary-gold); }

        /* MÓVILES */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; }
            .search-bar-row { flex-direction: column; }
            .header-controls { justify-content: flex-start; }
            #liveZonesMenu, #suggestions { top: 90px; }
            #menu { top: 140px; left: 15px; right: 15px; width: auto; }
            .ad-container { bottom: 30px; }
        }

        /* POPUPS MAPBOX */
        .mapboxgl-popup-content {
            background: rgba(18, 18, 18, 0.95) !important; border: 1px solid var(--primary-gold);
            color: #fff !important; border-radius: 12px !important; padding: 15px !important;
        }
        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: var(--primary-gold) !important; }
        .mapboxgl-popup-close-button { color: #fff; font-size: 16px; padding: 4px 8px; }
        .mapboxgl-popup-close-button:hover { color: var(--primary-gold); background: transparent; }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="ui-layer">
        <header class="header">
            <!-- LOGO -->
            <div class="brand glass-ui">
                <img src="./img/oilmap.png" alt="Icon">
                <h1>WORLD OIL MAP <span>2026</span></h1>
            </div>

            <!-- BUSCADOR Y LIVE ZONES -->
            <div class="search-container">
                <div class="search-bar-row">
                    <input type="text" id="countrySearch" class="search-input glass-ui" placeholder="Search Oil Block, Facility...">
                    <button id="btn-live-zones" class="btn-live-zones glass-ui">🔴 Live Zones ▾</button>
                </div>
                
                <div id="suggestions" class="glass-ui"></div>
                <div id="liveZonesMenu" class="glass-ui">
                    <div style="padding: 10px; text-align: center; font-size: 0.8rem; color: #a0a0a5;">Cargando datos en vivo...</div>
                </div>
            </div>

            <!-- CONTROLES DERECHOS -->
            <div class="header-controls">
                <button id="btn-toggle-menu" class="btn-header">LAYERS ▾</button>
                <a href="blog.html" class="btn-header">Blog</a>
                <a href="contact.html" class="btn-header">Contact</a>
                <button id="btn-about" class="btn-header">About</button>
            </div>
            
            <nav id="menu" class="glass-ui"></nav>
        </header>

        <!-- PUBLICIDAD -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4035003913367801" data-ad-slot="TU_NUEVO_ID_ADAPTABLE" data-ad-format="horizontal" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>

    <!-- MODAL ABOUT -->
    <div id="aboutModal" class="modal">
        <div class="modal-content glass-ui">
            <span class="close" id="closeModal">&times;</span>
            <img src="./img/oilmap.png" style="width:70px; margin-bottom: 15px;">
            <h2 style="color: var(--primary-gold); margin:0 0 10px 0;">World Oil Map 2026</h2>
            <p>Location-Intelligence application for Oil and Gas sector.</p>
            <p>Powered by <a href="https://roqueleal.me/" style="color:var(--primary-gold); text-decoration:none; font-weight:bold;">Roque LEAL</a>.</p>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN MAPBOX ---
        mapboxgl.accessToken = 'pk.eyJ1Ijoicm9xdWVsZWFsIiwiYSI6ImNqaHVzZTA4ODBkZjczdmt0cTNrbGo1ZWEifQ.m7xOPPWAFsY-A4cAr5nDAw';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/roqueleal/ckg8c3kqf3udn19p3zhhhia61',
            center: [-64.974, 18.198],
            zoom: 3,
            attributionControl: false
        });
        map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

        // --- 2. GDELT PROXY CORS ---
        const gdeltBaseUrl = 'https://api.gdeltproject.org/api/v2/geo/geo?query=oil%20OR%20petroleum&mode=pointdata&format=geojson';
        const urlNews = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(gdeltBaseUrl);
        const toggleableLayerIds = ['PRODUCTION', 'BID-ROUNDS', 'EXPLORATION', 'REFINERIES', 'OIL-PIPELINE', 'GAS-PIPELINE', 'NEWS', 'CLUSTER-NEWS'];

        // --- 3. CARGA DE LIVE ZONES ---
        async function loadLiveZones() {
            const menu = document.getElementById('liveZonesMenu');
            try {
                const response = await fetch(urlNews);
                if (!response.ok) throw new Error('Error Proxy');
                const data = await response.json();
                menu.innerHTML = '';
                
                if (data && data.features && data.features.length > 0) {
                    const topZones = data.features.slice(0, 5);
                    topZones.forEach((feature, index) => {
                        const props = feature.properties;
                        const coords = feature.geometry.coordinates;
                        const title = props.name || 'Petroleum Zone';
                        
                        const item = document.createElement('div');
                        item.className = 'zone-item';
                        item.innerHTML = `<strong>Top #${index + 1}</strong> <span>${title}</span>`;
                        
                        item.onclick = () => {
                            menu.style.display = 'none';
                            map.flyTo({ center: coords, zoom: 9, speed: 1.2, essential: true });
                            const popupHTML = `
                                <div style="font-family:'Inter',sans-serif;">
                                    <strong style="color:var(--primary-gold); display:block; margin-bottom:8px;">${title}</strong>
                                    ${props.shareimage ? `<img src="${props.shareimage}" style="width:100%; border-radius:6px; margin-bottom:8px;">` : ''}
                                    <div style="font-size:12px; color:#ddd; max-height:100px; overflow-y:auto;">${props.html || ''}</div>
                                </div>`;
                            setTimeout(() => { new mapboxgl.Popup({ offset: 15 }).setLngLat(coords).setHTML(popupHTML).addTo(map); }, 500);
                        };
                        menu.appendChild(item);
                    });
                } else {
                    menu.innerHTML = '<div style="padding: 10px; text-align: center; color: #a0a0a5;">Sin datos recientes.</div>';
                }
            } catch (error) {
                menu.innerHTML = '<div style="padding: 10px; text-align: center; color: red;">Error al conectar API.</div>';
            }
        }

        // --- 4. MAPA CARGADO ---
        map.on('load', async () => {
            // Cargar datos GeoJSON a través del Proxy
            try {
                const response = await fetch(urlNews);
                const geojsonData = await response.json();

                map.addSource('gdelt-source', {
                    type: 'geojson', data: geojsonData, cluster: true, clusterMaxZoom: 14, clusterRadius: 50
                });

                map.addLayer({
                    id: 'CLUSTER-NEWS', type: 'circle', source: 'gdelt-source', filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': ['step', ['get', 'point_count'], '#f0b823', 5, '#f08023', 10, '#ff521d'],
                        'circle-radius': ['step', ['get', 'point_count'], 20, 10, 30, 750, 40],
                        'circle-stroke-width': 2, 'circle-stroke-color': 'rgba(255,255,255,0.5)'
                    }
                });

                map.addLayer({
                    id: 'cluster-count', type: 'symbol', source: 'gdelt-source', filter: ['has', 'point_count'],
                    layout: { 'text-field': '{point_count_abbreviated}', 'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'], 'text-size': 12 },
                    paint: { 'text-color': '#000000' }
                });

                map.addLayer({
                    id: 'NEWS', type: 'circle', source: 'gdelt-source', filter: ['!', ['has', 'point_count']],
                    paint: { 'circle-color': '#1dcaff', 'circle-radius': 8, 'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff' }
                });
            } catch (err) { console.error("Error cargando capas GDELT:", err); }

            // Menú de Capas con Verificación de Existencia
            const menuNav = document.getElementById('menu');
            toggleableLayerIds.forEach(id => {
                const link = document.createElement('a');
                link.href = '#'; link.className = 'active'; link.textContent = id.replace(/-/g, ' ');
                link.onclick = function(e) {
                    e.preventDefault();
                    if (map.getLayer(id)) {
                        const visibility = map.getLayoutProperty(id, 'visibility') || 'visible';
                        if (visibility === 'visible') { map.setLayoutProperty(id, 'visibility', 'none'); this.className = ''; } 
                        else { map.setLayoutProperty(id, 'visibility', 'visible'); this.className = 'active'; }
                    }
                };
                menuNav.appendChild(link);
            });

            loadLiveZones();
        });

        // --- 5. LÓGICA DE BÚSQUEDA ---
        const searchInput = document.getElementById('countrySearch');
        const suggestionsDiv = document.getElementById('suggestions');

        searchInput.addEventListener('input', async() => {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) { suggestionsDiv.style.display = 'none'; return; }

            let results = [];
            // Búsqueda en customData local si existe
            if (typeof customData !== 'undefined' && customData.features) {
                customData.features.forEach(f => {
                    if (f.properties.title.toLowerCase().includes(query)) {
                        results.push({ name: f.properties.title, coordinates: f.geometry.coordinates });
                    }
                });
            }

            // Búsqueda en Mapbox Geocoder API
            try {
                const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}`);
                const data = await res.json();
                if (data.features) {
                    data.features.forEach(f => results.push({ name: f.place_name, coordinates: f.center }));
                }
                
                suggestionsDiv.innerHTML = '';
                results.slice(0, 8).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = item.name;
                    div.onclick = () => {
                        map.flyTo({ center: item.coordinates, zoom: 8 });
                        new mapboxgl.Popup({ offset: 10 }).setLngLat(item.coordinates)
                            .setHTML(`<strong style="color:var(--primary-gold); font-family:Inter;">${item.name}</strong>`).addTo(map);
                        suggestionsDiv.style.display = 'none';
                        searchInput.value = '';
                    };
                    suggestionsDiv.appendChild(div);
                });
                suggestionsDiv.style.display = results.length > 0 ? 'block' : 'none';
            } catch (e) { console.error('Error Geocoder', e); }
        });

        // --- 6. INTERFAZ UI (MODALES Y MENÚS) ---
        const btnLiveZones = document.getElementById('btn-live-zones');
        const liveZonesMenu = document.getElementById('liveZonesMenu');
        const btnLayers = document.getElementById('btn-toggle-menu');
        const menuLayers = document.getElementById('menu');
        const btnAbout = document.getElementById('btn-about');
        const modal = document.getElementById('aboutModal');

        btnLiveZones.onclick = (e) => { e.stopPropagation(); liveZonesMenu.style.display = liveZonesMenu.style.display === 'flex' ? 'none' : 'flex'; menuLayers.classList.remove('show'); suggestionsDiv.style.display = 'none'; };
        btnLayers.onclick = (e) => { e.stopPropagation(); menuLayers.classList.toggle('show'); liveZonesMenu.style.display = 'none'; suggestionsDiv.style.display = 'none'; };
        btnAbout.onclick = () => modal.style.display = 'flex';
        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';

        document.onclick = (e) => {
            if (!liveZonesMenu.contains(e.target) && e.target !== btnLiveZones) liveZonesMenu.style.display = 'none';
            if (!menuLayers.contains(e.target) && e.target !== btnLayers) menuLayers.classList.remove('show');
            if (!suggestionsDiv.contains(e.target) && e.target !== searchInput) suggestionsDiv.style.display = 'none';
            if (e.target == modal) modal.style.display = 'none';
        };

        // --- 7. POPUPS EN EL MAPA ---
        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: toggleableLayerIds });
            if (!features.length) return;
            const f = features[0];

            if (f.layer.id === 'CLUSTER-NEWS') {
                const clusterId = f.properties.cluster_id;
                map.getSource('gdelt-source').getClusterExpansionZoom(clusterId, (err, zoom) => {
                    if (err) return;
                    map.flyTo({ center: f.geometry.coordinates, zoom: zoom });
                });
                return;
            }
            
            let htmlContent = '';
            if (f.layer.id === 'NEWS') {
                htmlContent = `<div style="font-family:'Inter',sans-serif;"><strong style="color:var(--primary-gold);">${f.properties.name}</strong><br>${f.properties.shareimage ? `<img src="${f.properties.shareimage}" style="width:100%; border-radius:6px; margin:10px 0;">` : ''}<div style="color:#ddd; font-size:12px;">${f.properties.html}</div></div>`;
            } else if (f.layer.id === 'BID-ROUNDS') {
                htmlContent = `<div style="font-family:'Inter',sans-serif;"><strong style="color:var(--primary-gold);">${f.properties.title}</strong><br><span style="color:#ddd;">${f.properties.description}</span></div>`;
            } else {
                htmlContent = `<div style="font-family:'Inter',sans-serif;"><strong style="color:var(--primary-gold);">${f.properties.Name || f.properties.NAME || "Info"}</strong><br><span style="color:#ddd;">${f.properties.Descriptio || f.properties.Company || "Data"}</span></div>`;
            }
            new mapboxgl.Popup({ offset: 10 }).setLngLat(e.lngLat).setHTML(htmlContent).addTo(map);
        });

        map.on('mousemove', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: toggleableLayerIds });
            map.getCanvas().style.cursor = features.length ? 'pointer' : '';
        });
    </script>
</body>
</html>
