<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    
    <title>World Oil Map 2026 | Global Infrastructure</title>
    <meta name="description" content="Interactive location-intelligence application for the Oil and Gas sector.">
    <meta name="author" content="Roque Leal" />
    <link rel="icon" type="image/png" href="./img/oilmap.png" sizes="16x16">

    <link rel="preconnect" href="https://api.mapbox.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    
    <style>
        :root {
            --primary: #f0b823;
            --surface: rgba(20, 20, 22, 0.85);
            --surface-hover: rgba(40, 40, 45, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --transition: all 0.25s ease;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background: #000; color: var(--text);
            overflow: hidden;
        }

        #map { position: absolute; inset: 0; z-index: 1; }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .ui-layer {
            position: absolute; z-index: 10;
            inset: 0; pointer-events: none;
            display: flex; flex-direction: column; padding: 20px;
        }

        .ui-layer > * { pointer-events: auto; }

        .top-bar {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 16px;
        }

        .brand-pill {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-radius: 100px;
        }
        .brand-pill img { height: 24px; }
        .brand-pill h1 { font-size: 0.9rem; margin: 0; color: var(--primary); }

        /* Conteneur de recherche et boutons */
        .search-wrapper {
            position: relative; flex-grow: 1; max-width: 500px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .search-bar-row {
            display: flex; gap: 8px; width: 100%;
        }

        .search-input {
            flex-grow: 1; padding: 12px 16px;
            border-radius: 100px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            outline: none; transition: var(--transition);
        }
        .search-input:focus { border-color: var(--primary); }

        .btn-live-zones {
            display: flex; align-items: center; gap: 6px;
            padding: 0 16px; border-radius: 100px;
            background: rgba(240, 184, 35, 0.1); border: 1px solid var(--primary);
            color: var(--primary); font-weight: 600; cursor: pointer;
            transition: var(--transition); white-space: nowrap;
        }
        .btn-live-zones:hover { background: var(--primary); color: #000; }

        /* Fenêtre flottante Live Zones */
        #liveZonesMenu {
            position: absolute; top: 55px; left: 0; right: 0;
            border-radius: 12px; display: none; flex-direction: column;
            max-height: 250px; overflow-y: auto; z-index: 30;
        }
        .zone-item {
            padding: 12px 16px; cursor: pointer; font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 4px;
        }
        .zone-item:hover { background: rgba(255,255,255,0.05); color: var(--primary); }
        .zone-item strong { font-size: 0.75rem; color: #a0a0a5; }

        /* Boutons d'action */
        .action-group { display: flex; gap: 8px; position: relative; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid var(--border); color: var(--text);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: var(--primary); color: #000; }
        .icon-btn svg { width: 20px; height: 20px; }

        /* Menu des couches */
        #menu {
            position: absolute; top: 55px; right: 0; width: 180px;
            padding: 12px; display: none; flex-direction: column; gap: 6px; border-radius: 12px;
        }
        #menu a {
            color: rgba(255,255,255,0.7); text-decoration: none;
            font-size: 0.75rem; padding: 8px; border-radius: 6px; text-transform: uppercase;
        }
        #menu a.active { background: var(--primary); color: #000; font-weight: 600; }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; }
            .action-group { position: fixed; bottom: 20px; right: 20px; flex-direction: column; }
            #menu { top: auto; bottom: 80px; right: 80px; }
            .search-bar-row { flex-direction: column; }
            #liveZonesMenu { top: 100px; }
        }

        /* Personnalisation Popups Mapbox */
        .mapboxgl-popup-content {
            background: rgba(20, 20, 22, 0.95) !important;
            border: 1px solid var(--primary); color: #fff !important;
            border-radius: 12px !important; padding: 15px !important;
        }
        .mapboxgl-popup-close-button { color: #fff; font-size: 16px; padding: 4px 8px; }
        .mapboxgl-popup-close-button:hover { color: var(--primary); background: transparent; }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="brand-pill glass">
                <img src="./img/oilmap.png" alt="Oil Map">
                <h1>WORLD OIL MAP 2026</h1>
            </div>

            <div class="search-wrapper">
                <div class="search-bar-row">
                    <input type="text" class="search-input glass" id="countrySearch" placeholder="Search oil block...">
                    <!-- Nouveau Bouton Live Zones -->
                    <button class="btn-live-zones glass" id="btn-live-zones">
                        🔴 Live Zones ▾
                    </button>
                </div>
                
                <!-- Fenêtre flottante Live Zones -->
                <div id="liveZonesMenu" class="glass">
                    <div style="padding: 10px; text-align: center; font-size: 0.8rem; color: #a0a0a5;">Loading zones...</div>
                </div>
            </div>

            <div class="action-group">
                <button class="icon-btn glass" id="btn-layers">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>
                </button>
                <nav id="menu" class="glass"></nav>
            </div>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoicm9xdWVsZWFsIiwiYSI6ImNqaHVzZTA4ODBkZjczdmt0cTNrbGo1ZWEifQ.m7xOPPWAFsY-A4cAr5nDAw';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/roqueleal/ckg8c3kqf3udn19p3zhhhia61',
            center: [-64.974, 18.198],
            zoom: 3,
            attributionControl: false
        });
        map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

        const urlNews = 'https://api.gdeltproject.org/api/v2/geo/geo?zoomwheel=0&query=petroleum%20(sourcelang:zho%20OR%20sourcelang:eng%20OR%20sourcelang:rus%20OR%20sourcelang:spa)%20&mode=pointdata&format=geojson';

        // Fonction pour charger le menu Live Zones
        async function loadLiveZones() {
            const menu = document.getElementById('liveZonesMenu');
            try {
                const response = await fetch(urlNews);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                menu.innerHTML = ''; // Nettoyer le menu
                
                if (data.features && data.features.length > 0) {
                    const topZones = data.features.slice(0, 5);
                    
                    topZones.forEach((feature, index) => {
                        const props = feature.properties;
                        const coords = feature.geometry.coordinates;
                        const title = props.name || 'Petroleum Zone';
                        
                        const item = document.createElement('div');
                        item.className = 'zone-item';
                        item.innerHTML = `<strong>Top #${index + 1}</strong> <span>${title}</span>`;
                        
                        // Action au clic : Vol avec zoom 9
                        item.onclick = () => {
                            menu.style.display = 'none'; // Ferme la fenêtre flottante
                            map.flyTo({ center: coords, zoom: 9, speed: 1.2, essential: true });

                            const popupHTML = `
                                <div style="font-family:'Inter',sans-serif;">
                                    <strong style="color:var(--primary); display:block; margin-bottom:8px;">${title}</strong>
                                    ${props.shareimage ? `<img src="${props.shareimage}" style="width:100%; border-radius:6px; margin-bottom:8px;">` : ''}
                                    <div style="font-size:12px; color:#ddd; max-height:100px; overflow-y:auto;">${props.html || ''}</div>
                                </div>
                            `;
                            // Retarde légèrement l'ouverture de la popup pour laisser l'animation commencer
                            setTimeout(() => {
                                new mapboxgl.Popup({ offset: 15 }).setLngLat(coords).setHTML(popupHTML).addTo(map);
                            }, 500);
                        };
                        menu.appendChild(item);
                    });
                }
            } catch (error) {
                menu.innerHTML = '<div style="padding: 10px; text-align: center; color: red;">Failed to load zones.</div>';
            }
        }

        map.on('load', () => {
            // 1. Unification de la source GDELT
            map.addSource('gdelt-source', {
                type: 'geojson',
                data: urlNews,
                cluster: true,
                clusterMaxZoom: 14,
                clusterRadius: 50
            });

            // 2. Couche CLUSTER (Cercles au lieu d'images pour éviter les erreurs)
            map.addLayer({
                id: 'CLUSTER-NEWS',
                type: 'circle',
                source: 'gdelt-source',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': ['step', ['get', 'point_count'], '#f0b823', 5, '#f08023', 10, '#ff521d'],
                    'circle-radius': ['step', ['get', 'point_count'], 20, 10, 30, 750, 40],
                    'circle-stroke-width': 2,
                    'circle-stroke-color': 'rgba(255,255,255,0.5)'
                }
            });

            // 3. Couche Nombre de Clusters
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'gdelt-source',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count_abbreviated}',
                    'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                    'text-size': 12
                }
            });

            // 4. Couche NEWS individuelle (Points bleus clairs)
            map.addLayer({
                id: 'NEWS',
                type: 'circle',
                source: 'gdelt-source',
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-color': '#1dcaff',
                    'circle-radius': 8,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Création du menu des couches
            const toggleableLayerIds = ['PRODUCTION', 'BID-ROUNDS', 'EXPLORATION', 'REFINERIES', 'OIL-PIPELINE', 'GAS-PIPELINE', 'NEWS', 'CLUSTER-NEWS'];
            const menuNav = document.getElementById('menu');
            
            toggleableLayerIds.forEach(id => {
                const link = document.createElement('a');
                link.href = '#'; link.className = 'active'; link.textContent = id.replace(/-/g, ' ');
                
                link.onclick = function(e) {
                    e.preventDefault();
                    // Sécurité : vérifier si la couche existe dans le style
                    if (map.getLayer(id)) {
                        const visibility = map.getLayoutProperty(id, 'visibility') || 'visible';
                        if (visibility === 'visible') { 
                            map.setLayoutProperty(id, 'visibility', 'none'); 
                            this.className = ''; 
                        } else { 
                            map.setLayoutProperty(id, 'visibility', 'visible'); 
                            this.className = 'active'; 
                        }
                    } else {
                        console.warn(`Layer "${id}" not found in Mapbox style.`);
                        // Optionnel : avertir l'utilisateur
                        // alert(`La couche ${id} n'est pas disponible dans cette vue.`);
                    }
                };
                menuNav.appendChild(link);
            });

            // Charger les zones au démarrage
            loadLiveZones();
        });

        // Gestion de l'interface utilisateur
        const btnLiveZones = document.getElementById('btn-live-zones');
        const liveZonesMenu = document.getElementById('liveZonesMenu');
        const btnLayers = document.getElementById('btn-layers');
        const menuLayers = document.getElementById('menu');

        // Toggle Live Zones
        btnLiveZones.onclick = (e) => {
            e.stopPropagation();
            const isShowing = liveZonesMenu.style.display === 'flex';
            liveZonesMenu.style.display = isShowing ? 'none' : 'flex';
            menuLayers.style.display = 'none'; // Ferme les autres menus
        };

        // Toggle Layers
        btnLayers.onclick = (e) => {
            e.stopPropagation();
            const isShowing = menuLayers.style.display === 'flex';
            menuLayers.style.display = isShowing ? 'none' : 'flex';
            liveZonesMenu.style.display = 'none'; // Ferme les autres menus
        };

        // Fermer les menus au clic extérieur
        document.onclick = (e) => {
            if (!liveZonesMenu.contains(e.target) && e.target !== btnLiveZones) {
                liveZonesMenu.style.display = 'none';
            }
            if (!menuLayers.contains(e.target) && e.target !== btnLayers) {
                menuLayers.style.display = 'none';
            }
        };

        // Popups au clic sur le plan
        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point, { 
                layers: ['PRODUCTION', 'BID-ROUNDS', 'EXPLORATION', 'REFINERIES', 'OIL-PIPELINE', 'GAS-PIPELINE', 'NEWS', 'CLUSTER-NEWS'] 
            });
            if (!features.length) return;
            const f = features[0];

            let htmlContent = '';
            
            // Si on clique sur un cluster, on zoome dessus
            if (f.layer.id === 'CLUSTER-NEWS') {
                const clusterId = f.properties.cluster_id;
                map.getSource('gdelt-source').getClusterExpansionZoom(clusterId, (err, zoom) => {
                    if (err) return;
                    map.flyTo({ center: f.geometry.coordinates, zoom: zoom });
                });
                return; // Ne pas ouvrir de popup pour le cluster
            }
            
            if (f.layer.id === 'NEWS') {
                htmlContent = `
                    <div style="font-family:'Inter',sans-serif;">
                        <strong style="color:var(--primary);">${f.properties.name}</strong><br>
                        ${f.properties.shareimage ? `<img src="${f.properties.shareimage}" style="width:100%; border-radius:6px; margin:10px 0;">` : ''}
                        <div style="color:#ddd; font-size:12px;">${f.properties.html}</div>
                    </div>`;
            } else if (f.layer.id === 'BID-ROUNDS') {
                htmlContent = `<div style="font-family:'Inter',sans-serif;"><strong style="color:var(--primary);">${f.properties.title}</strong><br><span style="color:#ddd;">${f.properties.description}</span></div>`;
            } else {
                htmlContent = `<div style="font-family:'Inter',sans-serif;"><strong style="color:var(--primary);">${f.properties.Name || f.properties.NAME || "Info"}</strong><br><span style="color:#ddd;">${f.properties.Descriptio || f.properties.Company || "Data"}</span></div>`;
            }

            new mapboxgl.Popup({ offset: 10 }).setLngLat(e.lngLat).setHTML(htmlContent).addTo(map);
        });

        // Curseur interactif
        map.on('mousemove', (e) => {
            const features = map.queryRenderedFeatures(e.point, { 
                layers: ['PRODUCTION', 'BID-ROUNDS', 'EXPLORATION', 'REFINERIES', 'OIL-PIPELINE', 'GAS-PIPELINE', 'NEWS', 'CLUSTER-NEWS'] 
            });
            map.getCanvas().style.cursor = features.length ? 'pointer' : '';
        });
    </script>
</body>
</html>
